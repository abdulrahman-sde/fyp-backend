services:
  db:
    image: postgres:18.3
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hireflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hireflow}
      POSTGRES_DB: ${POSTGRES_DB:-hireflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hireflow} -d ${POSTGRES_DB:-hireflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hireflow}:${POSTGRES_PASSWORD:-hireflow}@db:5432/${POSTGRES_DB:-hireflow}
      NODE_ENV: development
      PORT: 4000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CLOUDINARY_URL: ${CLOUDINARY_URL}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      ELEVEN_API_KEY: ${ELEVEN_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_use_a_long_random_secret}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      GROQ_API_KEY: ${GROQ_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
      # LiveKit — backend in container reaches host LiveKit via host.docker.internal
      # (override of any LIVEKIT_URL=localhost from .env, which would resolve to the container itself)
      LIVEKIT_URL: ws://host.docker.internal:7880
      # URL returned to the candidate's browser — must be reachable from the host
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret_dev_only_not_for_production_at_least_32chars}
      AGENT_WEBHOOK_SECRET: ${AGENT_WEBHOOK_SECRET:-dev_agent_webhook_secret_change_in_prod_xyz}
    ports:
      - "4000:4000"
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
