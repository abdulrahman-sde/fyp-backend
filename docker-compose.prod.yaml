services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 4000
    # Bind only to localhost; Nginx on the host should proxy to this.
    ports:
      - "127.0.0.1:4000:4000"

  # One-off migration runner (uses dev image so Prisma CLI is available).
  # Run with:
  #   docker compose --env-file .env.prod -f docker-compose.prod.yaml --profile tools run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    profiles: ["tools"]
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
    command: ["npx", "prisma", "migrate", "deploy"]
