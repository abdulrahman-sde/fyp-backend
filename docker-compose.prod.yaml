services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 4000
    # Bind only to localhost; Nginx on the host should proxy to this.
    ports:
      - "127.0.0.1:4000:4000"

  